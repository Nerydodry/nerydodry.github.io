<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CidadeViva</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <div id="autenticacao" class="tela-auth oculto">
    <div class="auth-caixa">
      <div class="auth-logo">🌿</div>
      <h1>CidadeViva</h1>
      <p class="auth-slogan">Sua cidade mais limpa e sustentável</p>

      <div class="abas">
        <button id="abaEntrar" class="aba ativa" type="button">Entrar</button>
        <button id="abaCriar" class="aba" type="button">Criar conta</button>
      </div>

      <form id="formLogin" class="form-auth">
        <label>E-mail
          <input type="email" name="email" placeholder="voce@email.com" required autocomplete="email">
        </label>
        <label>Senha
          <input type="password" name="senha" placeholder="••••••" required minlength="6" autocomplete="current-password">
        </label>
        <button type="submit" class="botao-principal">Entrar</button>
      </form>

      <form id="formRegistro" class="form-auth oculto">
        <label>Nome completo
          <input type="text" name="nome" placeholder="Seu nome" required autocomplete="name">
        </label>
        <label>E-mail
          <input type="email" name="email" placeholder="voce@email.com" required autocomplete="email">
        </label>
        <label>Senha (mínimo 6 caracteres)
          <input type="password" name="senha" placeholder="••••••" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit" class="botao-principal">Criar minha conta</button>
      </form>

      <p id="mensagemAuth" class="mensagem-erro"></p>
    </div>
  </div>

  <div id="aplicativo" class="aplicativo oculto">
    <header class="topo">
      <h1>CidadeViva</h1>
      <button id="avatarTopo" class="avatar" type="button" title="Meu perfil"></button>
    </header>

    <main id="conteudo"></main>

    <nav class="menu">
      <button data-rota="#/inicio" type="button">🏠<span>Início</span></button>
      <button data-rota="#/denunciar" type="button">📸<span>Denunciar</span></button>
      <button data-rota="#/noticias" type="button">📰<span>Notícias</span></button>
      <button data-rota="#/chat" type="button">💬<span>Chat</span></button>
      <button data-rota="#/perfil" type="button">👤<span>Perfil</span></button>
    </nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
