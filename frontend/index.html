:root {

/* =========================

========================= */

.auth-caixa {

.auth-logo {

.abas {

.aba {

    background: transparent;
    border-radius: 9px;

}

.aba.ativa {

}

.form-auth {

label {

}

input,
textarea,
select {

    color: var(--texto);

input:focus,
textarea:focus,
select:focus {
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(22,131,75,.12);
}

.botao-principal {
    border: 0;
    background: var(--verde);
    color: white;
    padding: 14px;
    border-radius: 11px;
    font-weight: bold;

}

.botao-principal:hover {
    background: var(--verde-escuro);

}

.mensagem {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    display: none;
}

.mensagem.sucesso {
    display: block;
    background: #e7f8ed;
    color: #176536;
}

.mensagem.erro {
    display: block;
    background: #fdeaea;
    color: #a52323;
}

========================= */

main {

    margin-top: 25px;
}

.botao-branco {

}

.botao-transparente {

.titulo-secao {
    margin: 30px 0 15px;
    font-size: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.card {
    background: white;
    padding: 22px;

.card h3 {

.icone-grande {

.estatisticas {
    display: grid;
    grid-template-columns: repeat(3,1fr);

    margin-top: 20px;

.numero {
    font-size: 32px;
    color: var(--verde);
    font-weight: bold;
}

/* =========================
   DENÚNCIA
========================= */

.formulario {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: var(--sombra);
}

.formulario-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.formulario .campo-grande {
    grid-column: 1 / -1;
}

.upload-area {
    border: 2px dashed #a9cdb5;

.preview {

    margin-top: 15px;
    border-radius: 15px;
    display: none;

/* =========================
   NOTÍCIAS
========================= */

.noticia {

    padding: 0;
}

.noticia img {
    width: 100%;

}

.noticia-conteudo {

/* =========================
   ÓRGÃOS
========================= */

.orgao {

.orgao-icone {

.numero-telefone {

========================= */

.chat {

    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--sombra);

.chat-mensagens {
    height: 400px;
    padding: 20px;
    overflow-y: auto;
}

.mensagem-chat {
    background: var(--verde-claro);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    max-width: 80%;
}

.mensagem-chat strong {
    display: block;
    color: var(--verde-escuro);
}

.chat-form {
    padding: 15px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--borda);
}

.chat-form input {
    margin: 0;
}

/* =========================
   PERFIL
========================= */

.perfil {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: var(--sombra);

.avatar-grande {

    background: var(--verde);

    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: bold;
    margin-bottom: 15px;

.botao-perigo {
    background: var(--vermelho);

/* =========================

.menu {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;

    border-top: 1px solid var(--borda);
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 100;
}

.menu button {
    border: 0;
    background: transparent;
    color: var(--cinza);

.menu button span {
    font-size: 12px;
}

.menu button.ativo {
    color: var(--verde);
    font-weight: bold;

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    right: 20px;
    bottom: 95px;
    background: #173322;
    color: white;
    padding: 14px 18px;
    border-radius: 12px;
    box-shadow: var(--sombra);
    display: none;
    z-index: 200;
}

.toast.mostrar {
    display: block;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width: 800px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .estatisticas {
        grid-template-columns: 1fr;
    }

    .formulario-grid {
        grid-template-columns: 1fr;
    }

    .formulario .campo-grande {
        grid-column: auto;
    }

    .hero {
        padding: 25px;
    }

    .hero h2 {
        font-size: 30px;
    }

    .menu {
        justify-content: space-around;
        gap: 0;
    }

    .menu button {
        min-width: auto;
        flex: 1;
    }
}

@media(max-width: 500px) {
    .auth-caixa {
        padding: 25px 18px;
    }

    main {
        padding: 15px;
    }

    .topo {
        padding: 0 15px;
    }
}

function mudarIdioma(idioma) {

    idiomaAtual = idioma;

    localStorage.setItem(
        "cidadeviva_idioma",
        idioma
    );

    document.querySelectorAll("[data-i18n]")
        .forEach(elemento => {

            const chave =
                elemento.getAttribute("data-i18n");

            if (traducoes[idioma][chave]) {
                elemento.textContent =
                    traducoes[idioma][chave];
            }

        });

    const seletor =
        document.getElementById("idiomaAuth");

    if (seletor) {
        seletor.value = idioma;

}
